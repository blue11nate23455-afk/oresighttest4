# ============================================================
# Version pins for OreSight
#
# minecraft_version / yarn_mappings / loader_version / fabric_version
# are the ones most likely to drift, because Minecraft/Fabric ship
# new builds constantly. Before your first build, double-check them:
#
#   Yarn mappings for this MC version:
#     https://meta.fabricmc.net/v2/versions/yarn/1.21.11
#     (pick the newest "build" number and put it below)
#
#   Fabric Loader:
#     https://meta.fabricmc.net/v2/versions/loader
#
#   Fabric API (find the file matching 1.21.11 on):
#     https://modrinth.com/mod/fabric-api/versions
#
# EASIEST PATH: use the official generator at
#   https://fabricmc.net/develop/template/
# and select Minecraft 1.21.11 + Fabric Loader 0.19.2 + Fabric API.
# It fills in a guaranteed-correct yarn_mappings build number for you.
# You can then copy this project's src/ folder on top of what it
# generates (keeping its build.gradle/gradle.properties/wrapper).
# ============================================================

minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.19.2
fabric_version=0.141.6+1.21.11
loom_version=1.9-SNAPSHOT

mod_version=1.0.0
maven_group=com.oresight
archives_base_name=oresight

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
